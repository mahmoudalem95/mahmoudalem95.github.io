name: Sync home pages from mahalco

# Keeps index.html, ar/index.html, apis-he.html and apis-ar.html identical to the MAHALCO site.
on:
  schedule:
    - cron: "17 * * * *"      # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mahmoudalem95/mahalco
          path: _src
          sparse-checkout: |
            index.html
            ar/index.html
            apis-he.html
            apis-ar.html
          sparse-checkout-cone-mode: false
      - run: python3 build.py _src
      - name: Commit if changed
        run: |
          rm -rf _src
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync home pages from mahalco"
          git push

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מהאלco</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.78);--text:#1c1c1e;--muted:#6e6e73;--accent:#0066cc;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(44,44,46,.72);--text:#f2f2f7;--muted:#a1a1a6;--accent:#4da3ff;--line:rgba(255,255,255,.12)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Arial Hebrew",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:34px 26px;text-align:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{font-size:1.45rem;line-height:1.4;margin:0 0 24px;font-weight:700}
a{display:block;color:var(--accent);text-decoration:none;font-size:1.05rem;padding:12px;border-top:1px solid var(--line)}
a:last-child{padding-bottom:0}
</style>
